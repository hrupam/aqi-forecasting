# Keeps the deployed app fresh: every 3 hours it downloads the latest readings and
# weather for every city that has a model, re-forecasts and commits
# the new files. Streamlit Cloud redeploys automatically after each commit.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   OPENAQ_API_KEY   required
name: Update forecasts
on:
  schedule:
    - cron: "15 */3 * * *"        # every 3 hours (UTC)
  workflow_dispatch:              # adds a "Run workflow" button
permissions:
  contents: write
concurrency:
  group: update-forecasts
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update every city
        run: python pipeline.py update --all-cities
        continue-on-error: true          # one city's feed being down must not block the others
      - name: Commit new data
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data reports
          git commit -m "Forecast update $(date -u '+%F %H:%M')" || echo "No changes"
          git push
